general {
  hide_cursor = true
}

animations {
  enabled = true

  bezier = easeOut, 0.33, 1, 0.68, 1
  bezier = linear, 0, 0, 1, 1

  animation = fadeIn, 1, 6.5, easeOut
  animation = fadeOut, 1, 4.5, easeOut
}

background {
  monitor =
  path = $HOME/.config/current_lockscreen
  blur_passes = 2
  blur_size = 4
}


label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(255, 255, 255, 0.8)

  font_size = 24
  font_family = JetBrainsMono Nerd Font

  position = 1187, 160
  halign = left
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%H:%M")"

  color = rgba(255, 255, 255, 1.0)
  font_size = 96
  font_family = JetBrainsMono Nerd Font

  position = 1176, 260
  halign = left
  valign = center
}

input-field {
  size = 350, 70
    position = 300, 100
    text_align = left
    outline_thickness = 0

    placeholder_text = 
    fail_text = 
    font_color = rgba(255, 255, 255, 0.1)
    font_family = JetBrainsMono Nerd Font

    outer_color = rgba(0, 0, 0, 0.0)
    inner_color = rgba(0, 0, 0, 0.0)
    check_color = rgba(0, 0, 0, 0.0)
    fail_color  = rgba(0, 0, 0, 0.0)
}
